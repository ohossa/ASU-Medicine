<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Electric Cobalt Depth Gradient -->
    <linearGradient id="cobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#385bfd" />
      <stop offset="50%" stop-color="#2743ff" />
      <stop offset="100%" stop-color="#1832cc" />
    </linearGradient>

    <!-- Warm Glowing Apricot Dot -->
    <linearGradient id="apricotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd985" />
      <stop offset="100%" stop-color="#ffbe3b" />
    </linearGradient>

    <!-- Subtle Depth Drop Shadow -->
    <filter id="subtleDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="rgba(10, 20, 60, 0.35)" />
    </filter>
  </defs>

  <!-- Full-bleed Vibrant Cobalt Squircle (Apple 22% Continuous Curvature) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#cobaltGrad)" />

  <!-- Inner High-Contrast Pure White Emblem Group -->
  <g filter="url(#subtleDepth)">
    <!-- Left Bracket { -->
    <path d="M150 142 C120 142, 114 172, 114 212 C114 240, 88 256, 88 256 C88 256, 114 272, 114 300 C114 340, 120 370, 150 370" 
          fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Bracket } -->
    <path d="M362 142 C392 142, 398 172, 398 212 C398 240, 424 256, 424 256 C424 256, 398 272, 398 300 C398 340, 392 370, 362 370" 
          fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center: Precision Heartbeat Pulse Line -->
    <path d="M165 256 L195 256 L212 288 L244 162 L276 350 L298 228 L312 256 L350 256" 
          fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Medical Plus Vertical Accent at x=332 -->
    <path d="M332 220 L332 292" 
          fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" />

    <!-- Detached Warm Apricot Status Dot -->
    <circle cx="406" cy="106" r="24" fill="url(#apricotGrad)" stroke="#ffffff" stroke-width="5" />
  </g>
</svg>
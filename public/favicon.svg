<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b5bfd" />
      <stop offset="50%" stop-color="#2743ff" />
      <stop offset="100%" stop-color="#1832cc" />
    </linearGradient>
    <filter id="subtleDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="rgba(10, 20, 60, 0.4)" />
    </filter>
  </defs>

  <!-- Electric Cobalt Squircle (Apple 22% Curvature, 100% Transparent Corners) -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#cobaltGrad)" />

  <!-- Luminous Pure White 3D-feel A+ Monogram -->
  <g filter="url(#subtleDepth)">
    <!-- Architectural Letter A -->
    <path d="M102 380 L204 130 L306 380" 
          fill="none" stroke="#ffffff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M142 284 L266 284" 
          fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" />

    <!-- Clinical Medical Cross '+' in Superscript -->
    <!-- Horizontal -->
    <path d="M336 195 L424 195" 
          fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" />
    <!-- Vertical -->
    <path d="M380 151 L380 239" 
          fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" />
  </g>
</svg>

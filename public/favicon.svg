<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b5bfd" />
      <stop offset="50%" stop-color="#2743ff" />
      <stop offset="100%" stop-color="#1832cc" />
    </linearGradient>
    <linearGradient id="apricotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd985" />
      <stop offset="100%" stop-color="#ffb830" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(10, 20, 60, 0.4)" />
    </filter>
  </defs>

  <!-- Electric Cobalt Squircle with Transparent Corners -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#cobaltGrad)" />

  <!-- Bold High-Contrast Pure White Emblem (Maximized footprint for 16px tab clarity) -->
  <g filter="url(#softShadow)">
    <!-- Left Bracket { -->
    <path d="M142 125 C96 125, 86 168, 86 218 C86 248, 56 256, 56 256 C56 256, 86 264, 86 294 C86 344, 96 387, 142 387" 
          fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Bracket } -->
    <path d="M370 125 C416 125, 426 168, 426 218 C426 248, 456 256, 456 256 C456 256, 426 264, 426 294 C426 344, 416 387, 370 387" 
          fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Pulse Line -->
    <path d="M136 256 L180 256 L202 296 L244 145 L286 367 L312 225 L326 256 L376 256" 
          fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Medical Plus Vertical Bar -->
    <path d="M352 216 L352 296" 
          fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" />

    <!-- Detached Apricot Dot -->
    <circle cx="430" cy="88" r="26" fill="url(#apricotGrad)" stroke="#ffffff" stroke-width="5" />
  </g>
</svg>
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Official Ain Shams University Faculty of Medicine portal. Master all 42 integrated modules across Years 1 to 5 with 12,800+ faculty-verified MCQs, clinical spotters, and continuous assessment mock exams." />
    <title>ASU Medicine — Official Ain Shams Faculty of Medicine Portal</title>
    <link rel="canonical" href="https://asu.codes/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://asu.codes/" />
    <meta property="og:title" content="ASU Medicine — Official Medical Examination & Question Bank Portal" />
    <meta property="og:description" content="Master all 42 integrated medical modules (Years 1 to 5) with 12,800+ verified MCQs, clinical spotters, and continuous assessment mock exams." />
    <meta property="og:image" content="https://asu.codes/social-preview.png" />
    <meta property="og:image:secure_url" content="https://asu.codes/social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="ASU Medicine" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://asu.codes/" />
    <meta name="twitter:title" content="ASU Medicine — Official Medical Examination Portal" />
    <meta name="twitter:description" content="Master all 42 integrated medical modules (Years 1 to 5) with 12,800+ verified MCQs, clinical spotters, and continuous assessment mock exams." />
    <meta name="twitter:image" content="https://asu.codes/social-preview.png" />
    <meta name="twitter:image:width" content="1200" />
    <meta name="twitter:image:height" content="630" />

    <!-- Google Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://asu.codes/#website",
          "name": "ASU Medicine",
          "url": "https://asu.codes/",
          "description": "Comprehensive Ain Shams University Faculty of Medicine syllabus practice, question banks, and clinical spotters.",
          "publisher": {
            "@type": "EducationalOrganization",
            "name": "Ain Shams University Faculty of Medicine",
            "url": "https://med.asu.edu.eg/"
          }
        },
        {
          "@type": "MedicalWebPage",
          "@id": "https://asu.codes/#webpage",
          "url": "https://asu.codes/",
          "name": "ASU Medicine — Academic Examination & Question Bank Portal",
          "description": "Curriculum-aligned question bank and interactive training platform for Ain Shams medical students across Years 1 through 5.",
          "isPartOf": { "@id": "https://asu.codes/#website" }
        }
      ]
    }
    </script>

    <!-- Google Fonts for Editorial Luxury & Telemetry Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f8f9fc" />
    <!-- Set the saved/default theme before any React fallback or page content paints. -->
    <style id="theme-first-paint">
      html { background: #f8f9fc; color-scheme: light; }
      html.dark { background: #0c0e16; color-scheme: dark; }
      body { margin: 0; background: inherit; }
    </style>
    <script id="theme-bootstrap">
      (function () {
        var dark = true;
        try { dark = localStorage.getItem('theme') !== 'light'; } catch (_) {}
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0c0e16' : '#f8f9fc');
      })();
    </script>

    <!-- Preconnect to auth & analytics origins -->
    <link rel="preconnect" href="https://accounts.clerk.dev" crossorigin />
    <link rel="dns-prefetch" href="https://accounts.clerk.dev" />

    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ASU Portal" />
    <link rel="apple-touch-icon" href="/favicon-512.webp" />

    <link rel="preload" href="/fonts/manrope-400-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/archivo-700-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/amiri-400-normal-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/amiri-700-normal-arabic.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" defer></script>
  </body>
</html>
